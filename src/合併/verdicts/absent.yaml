# 六座位對稱稽核裁決：規則 D「族內座位缺席」（欄位 absent），共 59 條
# 基底：F:/aoe2de/src/origin/古龍921_無法無天.aoe2scenario（套 merge_spec.params.renames 後）
# 通則（四類假陽性 + 兩類真差異）：
#   FP1 名稱樣式正規化：seat_pattern 只在「自己座位」把職業字換成 C，
#       所以固定用同一職業字命名的六座位族（1刀2…6刀2）會被拆成 XC?（座位1）與 X刀（座位2-6）。
#   FP2 條件／效果順序：shape_of 含順序，原作同一族各座位順序常隨手對調。
#   FP3 同名不同族：原作命名極隨性（香城/金鵬島進出提示叫「槍33」「棍55」；
#       開場初始化叫「白2」；刷怪指示器叫「女3」），與真正的六座位族撞名。
#   FP4 命名錯位：同一功能在不同座位掛在不同編號上（十級絕招鏈：座位1-2 的 N船2 ≡ 座位3-6 的 N船3）。
#   D1 職業專屬技能鏈：每個師父只教自己那一班（刀客→1P狂刀震天、劍客→2P流星追月、
#      槍法家/王大小姐→3P梨花槍/回馬槍、棍法家/段干往生→4P、陸小鳳→5P金絲綿掌、
#      唐天容/李尋歡→6P飛刀手/唐門暗器/毒鏢）。師父對白六座位都有，技能鏈只有一座位——設計如此。
#   D2 真缺陷：僅 T4138 一條（見下）。
