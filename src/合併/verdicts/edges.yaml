# 六座位對稱稽核裁決：欄位 edge_missing（94 條）與 count（57 條），共 151 條
# 基底：F:/aoe2de/src/origin/古龍921_無法無天.aoe2scenario（套 merge_spec.params.renames 後）
# 通則（依出現頻率）：
#   A. NPC／野怪事件鏈撞名（最大宗）。原作有一大批「<數字><名>、<數字><名>2…5」的任務鏈
#      （T895–900 1狂、T901–905 2流、T955–960 6毒、T2131–2135 2血、T2151–2155 6破、
#       T2235–2239 6飛、T2260–2264 3馬、T2270–2274 5金…），模板固定為 4c4e/2c2e/3c2e/2c8e/2c1e。
#      首字的數字是 NPC 編號、不是座位，seat_pattern 卻讀成座位 → 該座位「多一支」，
#      主迴圈按索引配對後整族錯位，於是連帶噴出一串 edge_missing。
#   B. 區域提示鏈撞名。T4806–4877「白N/刀N/劍N/槍N/棍N/拳N/箭N ＋ NN/NNN/NNNN」是
#      「你已進入／離開香城、金鵬島」的四步提示，作者抄名時錯了好幾處（拳55→棍55、箭6→箭1…），
#      但接線全走 trigger_id、source_player 也對，功能無誤，只污染統計。
#   C. 座位1 的無編號慣例與命名筆誤。1赤1／1賓1／6子6／1草2.／\x7f少林寺／N治療 等，
#      邊其實存在，只是名稱正規化後對不上。這一類建議在 params.renames 順手正名。
#   D. 由別支代勞。同一件事在不同座位掛在鏈上的不同節點（船2 vs 船3、女2 vs 女3、
#      馬2 vs 馬3、4棍 vs N修、6神兵 vs N神兵1），集合相同、時序差一格。
#   E. 職業專屬設計。座位6 端木林拒絕護送、座位6 神兵改計時器循環——對白／數值都另寫過。
#   F. 真漏接／真抄錯（16 條，verdict 仍為 pending，reason 以「建議修：」開頭）。
#      最嚴重的是 T5365「4頭暈起」自指（P4 船暈後攻擊力永久回不來）、
#      T5491「漢娜斯1」誤指 6假牙查、T292「6道4」連號抄成棍系、T2540「4卜2」空效果。
